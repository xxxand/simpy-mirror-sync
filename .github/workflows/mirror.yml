name: Mirror GitLab to GitHub

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

jobs:

  mirror:

    runs-on: ubuntu-latest

    steps:

      - name: Sync from GitLab to GitHub mirror
        run: |
          git clone --bare https://gitlab.com/team-simpy/simpy.git upstream.git
          cd upstream.git
          git push --mirror \
            "https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/xxxand/simpy-mirror.git"
